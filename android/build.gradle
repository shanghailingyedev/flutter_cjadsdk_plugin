group = "com.example.flutter_cjadsdk_plugin"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://gitee.com/lysdk/maven/raw/master/maven/" }
        // maven { url "https://artifact.bytedance.com/repository/pangle/" }
        
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.example.flutter_cjadsdk_plugin"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {

// wm（mini）、fw（定制）、zf、blk、qm、彗星icon、芒果
        // 自有预算
        implementation 'cj.mobile:lywm-m:7.9.19.28' 
        implementation 'cj.mobile:mp-d:3.0.20'
        implementation 'cj.mobile:lyzf:2.7.6'
        implementation 'cj.mobile:lyblk:2.2.8'
        implementation 'cj.mobile:lyicon:2.5.4'
        implementation 'cj.mobile:lmg:1.0.6'

        // 主包
        implementation 'cj.mobile:lyAd-fwly:3.6.5'

        // other
        // implementation 'cj.mobile:anythink:6.6.22'
        implementation 'cj.mobile:hl:3.482.17.448'

        // // 联盟SDK        
        // implementation "com.pangle.cn:mediation-sdk:7.8.1.4"
        // implementation 'cj.mobile:ks:5.6.10.1'
        // implementation 'cj.mobile:bd:9.460'
        // implementation 'cj.mobile:gdt:4.701.1571'


        implementation 'com.squareup.okhttp3:okhttp:3.12.0'
        implementation 'com.github.bumptech.glide:glide:4.12.0'
        implementation 'androidx.recyclerview:recyclerview:1.0.0'
        implementation 'androidx.core:core-ktx:1.7.0'
        implementation 'com.google.code.gson:gson:2.8.6'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.7.10'

        implementation 'com.android.support.constraint:constraint-layout:2.0.4'
        implementation 'androidx.appcompat:appcompat:1.3.0'



        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
